<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090c12">
  <title>Administração | Voz Verídica</title>
  <style>
    :root{color-scheme:dark;--bg:#090c12;--panel:#111722;--line:#263244;--text:#edf2f8;--muted:#a0adbd;--red:#e84a4a;--gold:#e4bd70;--green:#57d6a0}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 70% -20%,#172335 0,transparent 45%),var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(480px,100%);padding:28px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px #0007}.brand{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.card h1{margin:8px 0;font-size:30px}.muted{color:var(--muted)}form{display:grid;gap:12px;margin-top:22px}input{width:100%;padding:13px 14px;border:1px solid #354258;border-radius:10px;background:#090e17;color:var(--text);font:inherit}button{border:0;border-radius:10px;padding:13px 16px;background:linear-gradient(135deg,var(--red),#c93640);color:white;font:inherit;font-weight:750;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.status{min-height:24px;margin-top:12px;color:#fecaca;font-size:14px}.back{display:inline-block;margin-top:18px;color:var(--muted);font-size:13px}.back:hover{color:white}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Voz Verídica · área restrita</div>
    <h1>Administração</h1>
    <p class="muted">Acesso exclusivo ao responsável. A sessão é privada e expira após oito horas.</p>
    <form id="login-form">
      <label for="password">Senha administrativa</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200">
      <button id="login-button" type="submit">Entrar</button>
    </form>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <a class="back" href="/">← Voltar ao site</a>
  </main>
  <script>
    const form=document.getElementById('login-form');
    const button=document.getElementById('login-button');
    const status=document.getElementById('status');
    form.addEventListener('submit',async(event)=>{
      event.preventDefault();button.disabled=true;status.textContent='Verificando…';
      try{
        const response=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});
        const data=await response.json();
        if(!response.ok)throw new Error(data.error||'Não foi possível entrar.');
        location.replace('/admin');
      }catch(error){status.textContent=error.message;document.getElementById('password').value='';document.getElementById('password').focus()}
      finally{button.disabled=false}
    });
  </script>
</body>
</html>
